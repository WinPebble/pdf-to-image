name: Build Windows Release Form

on:
  push:
    branches: [ main, nsis-beta-release ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-form:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $candidates = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "NSIS compiler not found after installation." }
          Write-Host "NSIS: $makensis"

      - name: Build Setup EXE
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\Build-Installer.ps1

      - name: Verify release-form artifact
        shell: pwsh
        run: |
          $setup = ".\artifacts\installer\WinPebble-PDF-to-Image-Setup-Beta1-Dev.exe"
          if (-not (Test-Path $setup)) { throw "Setup EXE was not produced." }

          $vi = (Get-Item $setup).VersionInfo
          if ($vi.ProductName -ne "WinPebble PDF to Image") {
            throw "Unexpected ProductName: $($vi.ProductName)"
          }
          if ($vi.ProductVersion -ne "0.9.0-beta.1") {
            throw "Unexpected ProductVersion: $($vi.ProductVersion)"
          }
          if ($vi.FileVersion -ne "0.9.0.1") {
            throw "Unexpected FileVersion: $($vi.FileVersion)"
          }

          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "SHA256 ($([IO.Path]::GetFileName($setup))) = $hash" |
            Set-Content ".\artifacts\installer\SHA256SUMS.txt" -Encoding ASCII

          Get-Item $setup | Select-Object Name,Length
          Get-Content ".\artifacts\installer\SHA256SUMS.txt"

      - name: Upload unsigned release-form artifact
        uses: actions/upload-artifact@v4
        with:
          name: winpebble-pdf-to-image-0.9.0-beta.1-unsigned
          path: |
            artifacts/installer/WinPebble-PDF-to-Image-Setup-Beta1-Dev.exe
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error
